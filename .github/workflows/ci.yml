name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # no torch/ultralytics needed: tests cover data prep, splits and the residual rule
      - run: pip install pytest ruff scikit-learn pyyaml pillow numpy pandas tqdm requests
      - run: ruff check .
      - run: pytest -q
